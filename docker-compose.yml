version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "50051:50051"  # gRPC port
      - "8000:8000"    # HTTP port (если есть)
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s